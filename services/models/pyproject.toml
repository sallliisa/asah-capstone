[project]
name = "kos-models"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "scikit-learn==1.7.2",
  "numpy==2.2.6",
  "joblib==1.5.2",
  "fastapi==0.121.1",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.5", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.31.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
kos-generate = "kos_models.generate:main"
kos-train = "kos_models.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
